# ============== 窗口管理系统优化 ==============
# 禁用窗口边框和标题栏，让窗口管理器完全控制
border=no
no-title-bar

# 默认启动时不自动聚焦，交给窗口管理器处理
--focus-on=never

# 退出全屏后不还原窗口大小
keep-open=yes

# 播放结束后保持窗口打开
keep-open-pause=yes


# ============== ytdl-format配置 ==============
# 播放视频音频格式
ytdl-format=bestvideo+bestaudio/best
# 设置cookies
ytdl-raw-options=cookies=~/Documents/cookies/%(domain)s.cookies.txt
# 禁用下载缩略图
ytdl-raw-options=skip-download=true,writethumbnail=false
# 将下载速度限制在 500KB/s
#ytdl-raw-options=limit-rate=500k
# 使用 HTTP 代理
ytdl-raw-options=proxy=http://127.0.0.1:7890
# 使用 SOCKS5 代理
#ytdl-raw-options=proxy=socks5://127.0.0.1:9050

# ============== 视频输出和性能 ==============
vo=gpu
hwdec=vaapi-copy

# 窗口大小自适应
autofit-larger=100%

# ============== 屏幕显示 (OSD) ==============
# 极简 OSD，只显示进度条
osc=yes

# 字体和颜色配置
osd-font="更纱黑体 UI SC Nerd Font SemiBold"
osd-font-size=40
osd-color="#CCFFFFFF"
osd-border-color="#DD322622"

# ============== 截图 ==============

# 截图保存路径
screenshot-directory=~/Pictures/ScreenShots/

# 截图文件格式
screenshot-format=png


# ============== 稍后观看 ==============

watch-later-dir="~~/cache/watch_later"
                                      # 在此目录中存储 "watch_later" 文件夹，其中的文件记录 --watch-later-options 指定的选项
watch-later-options=start,vid,aid,sid


# ============== 缓存 ==============

# 启用缓存，优化网络视频播放体验
#cache=yes

# 缓存大小，设置为 512MB
#cache-default=512000
# ============== 字幕 ==============
sub-auto=fuzzy
sub-codepage=utf-8
sub-font="更纱黑体 UI SC Nerd Font SemiBold"
sub-font-size=45
sub-bold=yes
sub-color="#FFFFFFFF"
sub-shadow-offset=1.5
sub-shadow-color="#70000000"
# 字幕首选语言
slang=chs,sc,zh-CN,zh-Hans,cht,tc,zh-Hant,zh-HK,zh-TW,chi,zho,zh

# ============== 快捷键映射 (与窗口管理器快捷键区分) ==============
# Hyprland 热键可能与 mpv 冲突，这里做一些调整
# 播放和暂停
#P=cycle pause
#SPACE=cycle pause


# 窗口最小化，Hyprland 通常用 Super + M，这里提供一个备用
#m=cycle-value show-text no no

# 退出
#q=quit
#ESC=quit

# 在退出时保存播放位置
save-position-on-quit=yes
