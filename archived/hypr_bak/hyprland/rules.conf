###################################################################################################
#                                 Hyprland v0.53+ 适配版规则配置                                  #
###################################################################################################

# -------- 基础行为规则 --------

# Warp 终端平铺
windowrule = match:class dev.warp.Warp, tile 1

# 画中画 (Picture-in-Picture) 浮动
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on

# 撕裂 (Tearing) 支持 - 降低游戏延迟
windowrule = match:class ^steam_app$, immediate 1

# 浮动窗口去除阴影 (可选)
# windowrule = match:floating 0, noshadow 1

# -------- 对话框/弹窗通用规则 (浮动 + 居中) --------

# 合并了原本分散的规则，更整洁
windowrule = match:title ^(Open File)(.*)$, float on, center on
windowrule = match:title ^(Select a File)(.*)$, float on, center on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on, center on
windowrule = match:title ^(Open Folder)(.*)$, float on, center on
windowrule = match:title ^(Save As)(.*)$, float on, center on
windowrule = match:title ^(Library)(.*)$, float on, center on
windowrule = match:title ^(File Upload)(.*)$, float on, center on

###################################################################################################
#                                      Linux 应用窗口设置                                         #
###################################################################################################

# --- LinuxQQ 规则 ---

# 1. 主窗口：允许微透
windowrule = match:class ^QQ$,float on, size 1280 800, center on

# 2. 图片查看器：必须浮动并居中 (防止拉伸)
windowrule = match:class ^QQ$ match:title ^(图片查看器)$, float on
# 兜底：某些版本标题为空或怪异，防止被平铺
windowrule = match:class ^QQ$ match:title ^$, float on

# 3. 设置窗口
windowrule = match:class ^QQ$ match:title ^(设置)$, float on, center on

# 4. 聊天记录 (独立窗口)
windowrule = match:class ^QQ$ match:title .*(群聊的聊天记录).*, float on

# 5. 其他弹窗 (转发/文件/登录)
windowrule = match:class ^QQ$ match:title ^(转发)$, float on, center on
windowrule = match:class ^QQ$ match:title ^(选择联系人)$, float on, center on
windowrule = match:class ^QQ$ match:title ^(发送文件)$, float on, center on
windowrule = match:class ^QQ$ match:title ^(接收文件)$, float on, center on
windowrule = match:class ^QQ$ match:title ^(暂无新消息)$, float on, center on
# 登录窗口
windowrule = match:class ^QQ$ match:title ^(QQ)$, float on, center on


