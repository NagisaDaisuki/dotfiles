# clash-verge
windowrule = match:class ^clash-verge$, float on, size 960 600, move 200 200, animation popin 70%

# mihomo-party
windowrule = match:class ^mihomo-party$, float on, size 960 600, move 200 200, animation popin 70%

# nwg-look
windowrule = match:class ^nwg-look$, float on, size 960 600, move 200 200, animation popin 70%

# mpv
windowrule = match:class ^mpv$, opacity 1.0 1.0, animation popin 70%

# blueman-manager (蓝牙管理)
windowrule = match:class ^blueman-manager$, float on, size 960 600, move 200 200, animation popin 70%

# Gwenview (看图)
windowrule = match:class ^gwenview$, float on, size 960 600, center on

# Nautilus (文件管理器)
windowrule = match:class ^org.gnome.Nautilus$, float on, size 960 600, center on, animation popin 70%

# Swayimg
windowrule = match:class ^swayimg$, float on, center on, animation popin 70%

# qBittorrent_Enhanced_Edition
windowrule = match:class ^org.qbittorrent.qBittorrent$, float on, center on, size 960 600,animation popin 70%, workspace 9
# bt download title
# windowrule = match:class ^org.qbittorrent.qBittorrent$, float on, center on, size 960 600,animation popin 70%

# Pavucontrol (音量控制) - 修复透明度问题
windowrule = match:class ^org.pulseaudio.pavucontrol$, float on, size 960 600, move 100 100, opacity 1.0

# Hillstone (VPN工具) - 发送到工作区 9
windowrule = match:class ^HillstoneSecureConnect$, float on, size 960 600, center on, workspace 9

# Yazi (TUI文件管理器)
windowrule = match:class ^Alacritty$, float on, size 960 600, center on, animation popin 70%

