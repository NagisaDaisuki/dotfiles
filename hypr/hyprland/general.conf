dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    vfr = true
    vrr = 1 # 可变刷新率Freesync 0 = 关 1 = 开 2 = 全屏时开
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us,br
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.7
    touchpad {
        #accel_profile = flat
        # 设置为 1 启用多指点击行为（Clickfinger Behavior）
        # 这种模式下：
        #   - 1 指点击 = 左键 (LMB)
        #   - 2 指点击 = 右键 (RMB)
        #   - 3 指点击 = 中键 (MMB)
        clickfinger_behavior = 1
        
        # 启用后，通常也建议启用 tap-to-click
        tap-to-click = true

        natural_scroll = true
        disable_while_typing = true
    }
}
gestures {

    #workspace_swipe = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

xwayland {
  force_zero_scaling = true
}


windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

