# ~/.config/hypr/hyprland/general.conf
# pywal from ~/.config/wal/templates/colors-hyprland.conf
# matugen from ~/.config/matugen/templates/hyprland-colors.conf
source = ~/.config/hypr/matugen/matugen-hyprland.conf

################
### MONITORS ###
################

monitor = eDP-1, 2560x1600@120, 0x0, 1, bitdepth, 10, cm, wide
ecosystem:no_update_news = true
# monitor = DP-2, disabled
# monitor = , preferred, auto, 1
# monitor = ,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1



#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 4
    
    # OLD (Pywal): col.active_border = $color1 $color4 45deg
    # NEW (Matugen): Use $primary and $secondary or $tertiary
    col.active_border = $primary $tertiary 45deg

    # OLD (Pywal): col.inactive_border = $background
    # NEW (Matugen): Use $outline or $surface_container
    col.inactive_border = $outline
    
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.75
    shadow {
        enabled = true
        range = 25
        render_power = 1000
        
        # OLD (Pywal): color = $color4
        # NEW (Matugen): Use $primary (or $shadow if available, but usually $primary looks best for glow)
        color = $primary
        
        color_inactive = rgba(00000000)
    }
    blur {
        enabled = true
        size = 3
        passes = 2
        
        # 设置 brightness 为 0.8 相当于给窗口背后加了一层深色滤镜
        # 这样碰到亮白色壁纸时，会给压成深灰色
        brightness = 0.8
        vibrancy = 0.0
        # 对暗部增强
        vibrancy_darkness = 0.5
        # 对比度为默认值
        contrast = 1.0
        # 噪点关闭
        noise = 0
    }
}
