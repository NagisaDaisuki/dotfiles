# ~/.config/hypr/hyprland/general.conf
# pywal from ~/.config/wal/templates/colors-hyprland.conf
source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################

monitor = eDP-1, 2560x1600@120, 0x0, 1, bitdepth, 10, cm, wide
ecosystem:no_update_news = true
# monitor = DP-2, disabled
# monitor = , preferred, auto, 1
# monitor = ,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $color1 $color4 45deg  #rgba(89b4faff) rgba(89b4faff) 45deg
    col.inactive_border = $background
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 1
    active_opacity = 0.9
    inactive_opacity = 0.65
    shadow {
        enabled = true, glow
        range = 25
        render_power = 1000
        color =  $color4 # rgba(89b4faff)
        color_inactive = rgba(00000000)
    }
    blur {
        enabled = true, blur
        size = 1
        passes = 5

        vibrancy = 0.1696
    }
}

