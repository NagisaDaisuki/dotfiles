#################
### AUTOSTART ###
#################

# 1. 设置 D-Bus 环境 (放在最前面以确保关键变量正确设置)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Polkit 认证代理
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# 3. 输入法、剪贴板
exec-once = fcitx5
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# 4. 核心组件 (Wayland 必需服务和 Hyprland 模块)
exec-once = hyprctl setcursor 'Hatsune-Miku' 32
exec-once = hypridle
# 通知服务 (你使用 swaync, 没问题，但要注意它和KDE通知服务的D-Bus冲突)
exec-once = swaync 
# 启动 Hyprland 自身的 Portal，确保 Wayland 屏幕共享和对话框正常
exec-once = /usr/lib/xdg-desktop-portal

# 5. 应用程序/工具
exec-once = udiskie
exec-once = /opt/Motrix/Motrix-1.8.19.AppImage 
exec-once = swww init
exec-once = swww-daemon --format xrgb
# 建议简化 Waybar 命令，或重命名配置文件避免空格
exec-once = waybar -c ~/.config/waybar/configs/mpris_middle -s ~/.config/waybar/style/full_bar.css
# exec-once = waybar -c ~/.config/waybar/configs/mpris_middle -s ~/.config/waybar/style/bintang_default.css
exec-once = /usr/lib/geoclue-2.0/demos/agent & gammastep

# 6. Hyprland 插件管理
exec-once = hyprpm reload
