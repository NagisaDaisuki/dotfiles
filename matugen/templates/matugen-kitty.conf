# =========================================================
# Kitty + Matugen — Soft Adaptive Theme
# 适用于 Hyprland blur + 透明 kitty，浅色/深色模式通用
# 参考: Catppuccin Latte, Solarized Light, Gruvbox Light
# =========================================================
# 设计要点:
#   1. background 用 surface_dim 而非 surface
#      → 浅色模式: #D8DAE0（柔和灰蓝）vs surface 的 #F7F9FF（近纯白）
#      → 配合 kitty 0.8 opacity + Hyprland blur 大幅减少反光洗字
#   2. ANSI 色全部用 MD3 token，自动适配明暗模式
#   3. bright 色和 regular 色使用相同 token（避免 _fixed token
#      在浅色模式下的低对比度问题），仅 neutral pair 做区分

# Core
foreground            {{ colors.on_surface.default.hex }}
background            {{ colors.surface_dim.default.hex }}
cursor                {{ colors.primary.default.hex }}
cursor_text_color     {{ colors.on_primary.default.hex }}
selection_foreground  {{ colors.on_primary_container.default.hex }}
selection_background  {{ colors.primary_container.default.hex }}
url_color             {{ colors.primary.default.hex }}

# Regular (ANSI 0–7)
color0  {{ colors.surface_container_low.default.hex }}
color1  {{ colors.error.default.hex }}
color2  {{ colors.tertiary.default.hex }}
color3  {{ colors.on_tertiary_container.default.hex }}
color4  {{ colors.primary.default.hex }}
color5  {{ colors.on_secondary_container.default.hex }}
color6  {{ colors.secondary.default.hex }}
color7  {{ colors.on_surface.default.hex }}

# Bright (ANSI 8–15) — 与 regular 同色，仅 neutral pair 用不同 token
color8  {{ colors.outline.default.hex }}
color9  {{ colors.error.default.hex }}
color10 {{ colors.tertiary.default.hex }}
color11 {{ colors.on_tertiary_container.default.hex }}
color12 {{ colors.primary.default.hex }}
color13 {{ colors.on_secondary_container.default.hex }}
color14 {{ colors.secondary.default.hex }}
color15 {{ colors.on_surface_variant.default.hex }}
