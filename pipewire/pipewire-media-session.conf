# This is a sample configuration file for the PipeWire media session manager.
#
# It is recommended to copy this file to a user-local directory,
# e.g. ~/.config/pipewire/pipewire-media-session.conf
# to make custom changes.
#

context.properties = {
    # The default node latency. This can be overridden by a graph, a client
    # or a module. For many bluetooth codecs, the latency needs to be a bit
    # higher.
    default.clock.quantum = 2048
    default.clock.rate = 48000
    #default.clock.quantum-min = 16
    #default.clock.quantum-max = 2048
    #default.clock.quantum-min = 32
    #default.clock.quantum-max = 2048

    # The default sink and source for new clients
    default.configured.audio.sink = ""
    default.configured.audio.source = ""
}

# The session manager will manage a list of default audio and video
# devices for new streams that don't have a configured device.
# It will select the most recently used device as the default.
# The default device can also be set by other applications or the
# user with pactl set-default-sink/source.
#
# The media-session also creates a default configured device for
# clients that don't have a device configured.
#
# Some clients have their own default device. It is possible to disable
# the default device management by the media-session:
# default-nodes = false
#
# The media-session can also manage the devices on a per-profile basis.
# For example, it can configure a different default device for
# each profile. This is useful for devices that have multiple
# profiles, such as a headset.
# default-per-profile = false

# Rules to apply when a new node is created.
# This list is processed in order.
#
# The node can be an audio or video source or sink.
#
# The properties are matched against the node properties.
# A match is a partial match, like a SQL LIKE statement.
# For example, if the property is "media.class = Audio/Source",
# then "media.class = Audio/Source/Microphone" will also match.
#
# The actions are applied when a rule matches.
# Actions can be:
# - set the priority of a node
# - set a node as default
# - connect a node to another node
#
# Actions can also change the node properties.
#
# The session manager can also be configured to not manage a node.
# For example, a node can be managed by another application.
# manage-nodes = false
#
# The media-session manager can also be configured to
# not manage a node when it is a device, a link or a port.
# manage-devices = false
# manage-links = false
# manage-ports = false

# The media session manager will load the default rules from
# /usr/share/pipewire/media-session.d/default.rules
# The rules in this file are merged with the rules in this file.
# The rules in this file take precedence.
#
# It is possible to disable the default rules:
# include-default-rules = false

# The session manager can load other rules from
# other directories.
# include-rules = /usr/share/pipewire/media-session.d/
#
# The include rules are processed in order.
# The rules from the included files are merged with the rules
# in this file. The rules in this file take precedence.
#

# Examples:
# Set the priority of a node with a high priority.
# {
#     matches = [ { "node.name" = "my-node" } ]
#     actions = {
#         update-props = {
#             node.priority = 1000
#         }
#     }
# }

# Set a node as default
# {
#     matches = [ { "node.name" = "my-node" } ]
#     actions = {
#         update-props = {
#             node.default = true
#         }
#     }
# }
