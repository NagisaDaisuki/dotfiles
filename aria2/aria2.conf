## 文件保存设置 ##

# 默认下载路径
dir=/home/Nagisa/Downloads
# 启用磁盘缓存, 0为禁用, 针对机械硬盘可以设大一点(如 32M)
disk-cache=32M
# 文件预分配方式, 建议 falloc (NTFS建议用 prealloc)
file-allocation=falloc
# 断点续传
continue=true

## 进度保存设置 ##

# 读取会话
input-file=/home/Nagisa/.config/aria2/aria2.session
# 保存会话
save-session=/home/Nagisa/.config/aria2/aria2.session
# 定时保存会话(秒)
save-session-interval=60

## RPC 设置 (与浏览器交互的关键) ##

# 启用 RPC 服务
enable-rpc=true
# 允许所有来源, web界面跨域需开启
rpc-allow-origin-all=true
# 允许非外部访问
rpc-listen-all=true
# RPC 监听端口, 默认 6800
rpc-listen-port=6800
# RPC 密钥 (重要！请修改这个密码，浏览器插件里要填)
rpc-secret=AkeboshiHimariDaisuki

## BT/PT 下载设置 ##

# 自动做种时间(0为一直做种, 建议设为0或者适量时间回馈社区)
seed-time=0
# 启用本地节点查找
bt-enable-lpd=true
# 强制加密 (防运营商封锁)
bt-require-crypto=true
# 单个种子最大连接数
bt-max-open-files=100
# 全局最大下载速度 (0为不限制)
max-overall-download-limit=0
# 单任务最大下载速度
max-download-limit=0
# 开启 DHT (非 PT 下载必须开启)
enable-dht=true
# 开启 IPv6 DHT
enable-dht6=true

# 伪装成Chrome
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

